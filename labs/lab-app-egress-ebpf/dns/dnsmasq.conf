# dnsmasq: the lab's only resolver. Authoritative for *.lab, no upstream.
no-resolv
no-hosts

# Each impersonated host resolves to a DISTINCT IP. Unlike a proxy lab, the
# kernel only ever sees IP addresses on the wire, so every FQDN needs its own
# address for the analyzer's IP->FQDN join to be unambiguous. One webhost
# container answers on all three via alias IPs.
address=/updates.goodvendor.lab/10.10.0.10
address=/cdn-metrics.tracklab.lab/10.10.0.11
address=/telemetry.adnexus.lab/10.10.0.12

# Kept on for debugging; the kernel sensor (not this log) is the evidence here.
log-queries
log-facility=/var/log/dns/queries.log

listen-address=0.0.0.0
bind-interfaces
