kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tetragon-bench
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    # Tetragon runs inside the node container, so it needs the host's /proc
    # (as seen by the kind node) to resolve processes: mounted at /procHost.
    extraMounts:
      - hostPath: /proc
        containerPath: /procHost
