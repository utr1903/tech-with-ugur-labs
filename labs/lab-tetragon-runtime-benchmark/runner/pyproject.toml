[project]
name = "app"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "pyyaml==6.0.4",
    "structlog==26.1.0",
]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "types-pyyaml==6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM",
  "RET", "ARG", "PTH", "ANN", "TRY", "LOG", "G", "C90",
]
ignore = [
  # TRY003: forbids a contextual f-string message in a raise; readable
  # error context needs it, so the rule is disabled at the project level
  # rather than annotating lines.
  "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
addopts = "--import-mode=importlib"

[tool.deptry]
known_first_party = ["app"]
extend_exclude = [".*_test\\.py", ".*conftest\\.py"]
