apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: attacker
  labels:
    app: attacker
spec:
  containers:
    - name: attacker
      image: lab/attacker:1
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
        - containerPort: 4444
        - containerPort: 3333
---
apiVersion: v1
kind: Service
metadata:
  name: attacker
  namespace: attacker
spec:
  selector:
    app: attacker
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: revshell, port: 4444, targetPort: 4444 }
    - { name: stratum, port: 3333, targetPort: 3333 }
