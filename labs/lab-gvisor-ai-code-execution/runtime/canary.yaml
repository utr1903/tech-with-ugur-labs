apiVersion: v1
kind: Namespace
metadata:
  name: runtime-canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.33
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canary
  namespace: runtime-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runtime-canary
  template:
    metadata:
      labels:
        app: runtime-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: python:3.12.12-slim-bookworm@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
          command: [python, -I, -u, -c]
          args:
            - |
              import json
              import socket
              import sys
              import time
              listener = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              listener.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              listener.bind(('0.0.0.0', 8080))
              listener.listen(16)
              while True:
                  connection, peer = listener.accept()
                  with connection:
                      connection.settimeout(5)
                      try:
                          data = b''
                          deadline = time.monotonic() + 5
                          while len(data) < 4096 and not data.endswith(b'\r\n\r\n'):
                              remaining = deadline - time.monotonic()
                              if remaining <= 0:
                                  break
                              connection.settimeout(remaining)
                              try:
                                  chunk = connection.recv(4096 - len(data))
                              except (OSError, TimeoutError):
                                  break
                              if not chunk:
                                  break
                              data += chunk
                          sys.stdout.write(json.dumps({'peer': peer[0], 'received_bytes': len(data), 'data': data.decode('ascii', errors='replace')}) + '\n')
                          sys.stdout.flush()
                          if data:
                              connection.sendall(b'HTTP/1.0 200 OK\r\nContent-Length: 2\r\n\r\n42')
                      except (OSError, TimeoutError) as error:
                          sys.stdout.write(json.dumps({'peer': peer[0], 'error': str(error)}) + '\n')
                          sys.stdout.flush()
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: canary
  namespace: runtime-canary
spec:
  type: NodePort
  selector:
    app: runtime-canary
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
