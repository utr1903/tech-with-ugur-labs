apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chat-postgres
  namespace: executor-app
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-postgres
  namespace: executor-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: chat-postgres}
  template:
    metadata:
      labels: {app: chat-postgres}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: {{ .Values.postgresImage | quote }}
        # Detect a dead Pod TCP peer without expiring locks held by live kernels.
        args: ["-c", "tcp_keepalives_idle=5", "-c", "tcp_keepalives_interval=2", "-c", "tcp_keepalives_count=3", "-c", "tcp_user_timeout=10000"]
        env:
        - {name: POSTGRES_USER, value: chat}
        - {name: POSTGRES_DB, value: chat}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingSecret }}
              key: password
        ports: [{containerPort: 5432}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 512Mi}
        readinessProbe:
          exec:
            command: [pg_isready, -U, chat, -d, chat]
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: chat-postgres}
