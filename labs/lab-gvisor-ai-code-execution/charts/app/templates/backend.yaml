apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-backend
  namespace: executor-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: chat-backend}
  template:
    metadata:
      labels: {app: chat-backend}
    spec:
      serviceAccountName: backend
      containers:
      - name: backend
        image: {{ .Values.backendImage | quote }}
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 3001}]
        env:
        - {name: IN_CLUSTER, value: 'true'}
        - {name: MODEL_MODE, value: {{ .Values.modelMode | quote }}}
        - {name: SCRIPTED_SCENARIO, value: {{ .Values.scriptedScenario | quote }}}
        {{- if eq .Values.modelMode "openai" }}
        - {name: OPENAI_MODEL, value: {{ .Values.openaiModel | quote }}}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.openaiSecret }}
              key: api-key
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingSecret }}
              key: url
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
            httpHeaders: [{name: Host, value: 'localhost:3001'}]
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
