apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-frontend
  namespace: executor-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: chat-frontend}
  template:
    metadata:
      labels: {app: chat-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: {{ required "frontendImage is required" .Values.frontendImage | quote }}
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 3000}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 512Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
          seccompProfile: {type: RuntimeDefault}
        readinessProbe:
          httpGet: {path: /, port: 3000}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-frontend
  namespace: executor-app
spec:
  type: ClusterIP
  selector: {app: chat-frontend}
  ports: [{port: 3000, targetPort: 3000}]
