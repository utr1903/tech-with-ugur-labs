services:
  # The egress gateway: the only container on more than one traffic network.
  # It is the workload network's single door to the destinations, and because
  # every request goes through it, it is also the meter.
  egress-proxy:
    image: envoyproxy/envoy:v1.39.1
    volumes:
      - ./proxy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      workload_net: {}
      egress_net: {}
      ops_net:
        ipv4_address: 10.30.0.10
    healthcheck:
      # The Envoy image ships no curl or wget, so this uses bash's own TCP
      # redirection to ask the admin interface whether the proxy is live. Admin
      # is bound to the ops_net address, not localhost, so the healthcheck asks
      # there.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/10.30.0.10/9901; printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q LIVE <&3'
      interval: 2s
      timeout: 3s
      retries: 20

  # Two workloads, one image, different request mixes. Both are attached to
  # workload_net ONLY: no default network, no host ports, no second interface.
  # HTTP_PROXY is the only way they know to reach anything.
  client-checkout:
    build: ./client
    environment:
      CLIENT_NAME: client-checkout
      HTTP_PROXY: http://egress-proxy:3128
      RUN_SECONDS: ${RUN_SECONDS:-120}
      REQUEST_PLAN: http://api.payments.example.com/orders@1000,http://assets.cdn.example.com/bundle.js@20000
      DENIED_URL: http://exfil.shadow-analytics.example.com/collect
      BYPASS_HOST: payments-direct.example.com
      BYPASS_PORT: "8080"
    networks:
      - workload_net
    depends_on:
      egress-proxy:
        condition: service_healthy
      upstream-payments:
        condition: service_healthy
      upstream-cdn:
        condition: service_healthy
      upstream-telemetry:
        condition: service_healthy

  client-batch:
    build: ./client
    environment:
      CLIENT_NAME: client-batch
      HTTP_PROXY: http://egress-proxy:3128
      RUN_SECONDS: ${RUN_SECONDS:-120}
      REQUEST_PLAN: http://telemetry.metrics.example.com/ingest@10000,http://assets.cdn.example.com/bundle.js@15000
      DENIED_URL: http://exfil.shadow-analytics.example.com/collect
      BYPASS_HOST: payments-direct.example.com
      BYPASS_PORT: "8080"
    networks:
      - workload_net
    depends_on:
      egress-proxy:
        condition: service_healthy
      upstream-payments:
        condition: service_healthy
      upstream-cdn:
        condition: service_healthy
      upstream-telemetry:
        condition: service_healthy

  # Three mock internet destinations. Each carries a network alias equal to the
  # FQDN it answers as, so the gateway's route config reads exactly as it would
  # in production. upstream-payments carries a second alias that is deliberately
  # NOT in the allow-list: it is the target of the bypass attempt, so its name
  # can never appear in the gateway's access log.
  upstream-payments:
    build: ./upstream
    environment:
      DESTINATION_NAME: api.payments.example.com
      PAYLOAD_BYTES: "2048"
    networks:
      egress_net:
        aliases:
          - api.payments.example.com
          - payments-direct.example.com
    healthcheck: &upstream_healthcheck
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 20

  upstream-cdn:
    build: ./upstream
    environment:
      DESTINATION_NAME: assets.cdn.example.com
      PAYLOAD_BYTES: "65536"
    networks:
      egress_net:
        aliases:
          - assets.cdn.example.com
    healthcheck: *upstream_healthcheck

  upstream-telemetry:
    build: ./upstream
    environment:
      DESTINATION_NAME: telemetry.metrics.example.com
      PAYLOAD_BYTES: "524288"
    networks:
      egress_net:
        aliases:
          - telemetry.metrics.example.com
    healthcheck: *upstream_healthcheck

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ops_net

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - ops_net
    depends_on:
      - prometheus

networks:
  # The private workload subnet. `internal: true` means Docker creates no
  # gateway for it: containers attached to it have no route to the host, to
  # other networks, or to the internet. This is what makes the whole lab honest
  # - the workloads are not merely configured to use the proxy, they have no
  # alternative.
  workload_net:
    internal: true
  # The far side of the gateway, standing in for the internet.
  egress_net:
  # Operations: the gateway's admin interface, Prometheus and Grafana. A fixed
  # subnet lets egress-proxy take a stable address here so Envoy's admin
  # listener can bind to it specifically instead of every interface.
  ops_net:
    ipam:
      config:
        - subnet: 10.30.0.0/24
