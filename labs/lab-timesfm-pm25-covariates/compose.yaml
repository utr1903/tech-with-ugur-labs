services:
  lab:
    build: .
    environment:
      HF_HOME: /cache/huggingface
      MPLBACKEND: Agg
      DATA_DIR: /app/data
      OUTPUT_DIR: /app/tmp
      LOG_LEVEL: info
    volumes:
      - model-cache:/cache/huggingface
      - ./tmp:/app/tmp
      - ./data:/app/data

volumes:
  model-cache:
