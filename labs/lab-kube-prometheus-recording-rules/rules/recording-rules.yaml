apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-recording-rules
  namespace: monitoring
  labels:
    release: kps          # required: the chart's Prometheus only selects rules with the release label
spec:
  groups:
    - name: lab.node.utilization
      interval: 15s
      rules:
        # node-exporter only knows scrape instances (IP:port); node_uname_info
        # carries the human node name. The join + label_replace attach it as `node`.
        - record: node:cpu_utilization:percent
          expr: |
            label_replace(
              100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
                * on(instance) group_left(nodename) node_uname_info,
              "node", "$1", "nodename", "(.+)")
        - record: node:memory_utilization:percent
          expr: |
            label_replace(
              100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
                * on(instance) group_left(nodename) node_uname_info,
              "node", "$1", "nodename", "(.+)")
        - record: node:unhealthy:info
          expr: |
            kube_node_status_condition{condition="Ready", status!="true"} == 1
              or kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
    - name: lab.pod.utilization
      interval: 15s
      rules:
        # Pod usage as % of its declared limit; kube_pod_info supplies the node name.
        - record: pod:cpu_utilization_vs_limit:percent
          expr: |
            100 * sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
              / sum by (namespace, pod) (kube_pod_container_resource_limits{resource="cpu"})
              * on(namespace, pod) group_left(node) max by (namespace, pod, node) (kube_pod_info)
        - record: pod:memory_utilization_vs_limit:percent
          expr: |
            100 * sum by (namespace, pod) (container_memory_working_set_bytes{container!=""})
              / sum by (namespace, pod) (kube_pod_container_resource_limits{resource="memory"})
              * on(namespace, pod) group_left(node) max by (namespace, pod, node) (kube_pod_info)
        - record: pod:unhealthy:info
          expr: |
            (kube_pod_container_status_waiting_reason{reason!="ContainerCreating"} == 1)
              * on(namespace, pod) group_left(node) max by (namespace, pod, node) (kube_pod_info)
