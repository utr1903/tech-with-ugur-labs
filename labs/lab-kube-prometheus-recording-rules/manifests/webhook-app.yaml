apiVersion: v1
kind: Namespace
metadata:
  name: webhook-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-app
  namespace: webhook-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-app
  template:
    metadata:
      labels:
        app: webhook-app
    spec:
      # Pinned to lab-kps-worker: verify.sh breaks lab-kps-worker2's kubelet,
      # and the alert-delivery target must survive that deterministically.
      nodeSelector:
        kubernetes.io/hostname: lab-kps-worker
      containers:
        - name: webhook-app
          image: webhook-app:0.1.0
          imagePullPolicy: Never   # image is side-loaded with `kind load`
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-app
  namespace: webhook-app
spec:
  selector:
    app: webhook-app
  ports:
    - port: 8080
      targetPort: 8080
