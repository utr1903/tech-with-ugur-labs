kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab-kps
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            node-monitor-grace-period: "20s"
  - role: worker
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-status-update-frequency: "4s"
  - role: worker
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-status-update-frequency: "4s"
