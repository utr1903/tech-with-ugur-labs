apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop
  namespace: faults
spec:
  replicas: 1
  selector: { matchLabels: { app: crashloop } }
  template:
    metadata: { labels: { app: crashloop } }
    spec:
      # Pinned to lab-kps-worker: the broken node (lab-kps-worker2) must never
      # host the fault pods, or their kubelet-scraped metrics freeze mid-run.
      nodeSelector:
        kubernetes.io/hostname: lab-kps-worker
      containers:
        - name: crash
          image: alpine:3.20.3
          command: ["sh", "-c", "sleep 5; exit 1"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
