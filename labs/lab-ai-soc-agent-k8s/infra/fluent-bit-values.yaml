tolerations:
  - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level warn
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
  inputs: |
    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*_storefront_*.log,/var/log/containers/*_payments_*.log,/var/log/containers/*_batch_*.log,/var/log/containers/*_ci_*.log
        Exclude_Path /var/log/containers/postgres-*_payments_*.log
        multiline.parser cri
        Refresh_Interval 2
        Skip_Long_Lines On
    [INPUT]
        Name tail
        Tag db.*
        Path /var/log/containers/postgres-*_payments_*.log
        multiline.parser cri
        Refresh_Interval 2
    [INPUT]
        Name tail
        Tag audit
        Path /var/log/kubernetes/kube-apiserver-audit.log
        Refresh_Interval 2
        Buffer_Max_Size 1MB
        Skip_Long_Lines On
    [INPUT]
        Name tail
        Tag runtime
        Path /var/log/tetragon/tetragon.log
        Refresh_Interval 2
        Buffer_Max_Size 1MB
        Skip_Long_Lines On
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log Off
        Labels Off
        Annotations Off
    [FILTER]
        Name kubernetes
        Match db.*
        Kube_Tag_Prefix db.var.log.containers.
        Merge_Log Off
        Labels Off
        Annotations Off
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.observability.svc
        Port 3100
        labels source=app, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
        remove_keys kubernetes, stream, _p, time
        line_format json
        drop_single_key raw
    [OUTPUT]
        Name loki
        Match db.*
        Host loki.observability.svc
        Port 3100
        labels source=db, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name']
        remove_keys kubernetes, stream, _p, time
        line_format json
        drop_single_key raw
    [OUTPUT]
        Name loki
        Match audit
        Host loki.observability.svc
        Port 3100
        labels source=audit
        line_format json
        drop_single_key raw
    [OUTPUT]
        Name loki
        Match runtime
        Host loki.observability.svc
        Port 3100
        labels source=runtime
        line_format json
        drop_single_key raw
