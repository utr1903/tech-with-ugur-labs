fullnameOverride: alertmanager
persistence: {enabled: false}
# Bearer token for the agent webhook, read from a file so it never appears
# in the config. The Secret is created by scripts/up-infra.sh.
extraSecretMounts:
  - name: agent-token
    mountPath: /etc/alertmanager/agent-token
    secretName: agent-webhook-token
    readOnly: true
config:
  global: {}
  route:
    receiver: soc-agent
    group_by: []
    group_wait: 45s
    group_interval: 5m
    repeat_interval: 4h
  receivers:
    - name: soc-agent
      webhook_configs:
        - url: http://soc-agent.soc.svc:8080/investigate
          send_resolved: false
          http_config:
            authorization:
              type: Bearer
              credentials_file: /etc/alertmanager/agent-token/token
