# Values for the cilium/tetragon chart (pinned in scripts/up-infra.sh).
tetragon:
  # kind nodes are containers, so the agent reads the node's /proc from the
  # extraMount declared in kind-config.yaml.
  hostProcPath: /procHost
  enableProcessCred: true
  enableProcessNs: true
  # Show process lineage in events (parent binary tells an admin exec from
  # a shell spawned by the web server).
  processAncestors:
    enabled: "base,kprobe"
  # An empty allowlist lifts the chart's event-type filter, so every event
  # type is exported. Which namespaces are exported is decided by the
  # denylist below, not by this setting.
  exportAllowList: ""
  # Keep the chart's default entries (probe health checks; host processes
  # "", cilium, kube-system) and also drop the cluster's own plumbing so the
  # logs only describe workloads. Any other namespace, including one an
  # attacker creates, is still recorded.
  exportDenyList: |-
    {"health_check":true}
    {"namespace":["", "cilium", "kube-system", "observability", "soc", "local-path-storage"]}
