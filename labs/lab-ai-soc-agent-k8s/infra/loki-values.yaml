# grafana/loki single-binary with the ruler enabled.
deploymentMode: SingleBinary
loki:
  # Chart 7.7.0 ships image 3.6.11 despite appVersion 3.6.20; pin it.
  image:
    tag: 3.6.20
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: false
  rulerConfig:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /var/loki/rules-temp
    alertmanager_url: http://alertmanager.observability.svc:9093
    enable_api: true
    evaluation_interval: 15s
    poll_interval: 15s
singleBinary:
  replicas: 1
  # The chart does not mount ruler.directories into the single-binary pod,
  # so mount our own rules ConfigMap. Tenant "fake" = auth_enabled: false.
  extraVolumes:
    - name: rules
      configMap: {name: loki-alert-rules}
  extraVolumeMounts:
    - name: rules
      mountPath: /etc/loki/rules/fake
      readOnly: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  persistence:
    enabled: true
    size: 2Gi
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
gateway: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
memberlist:
  service:
    publishNotReadyAddresses: true
# enabled: false would drop the whole ruler block (incl. alertmanager_url).
ruler: {enabled: true, replicas: 0}
