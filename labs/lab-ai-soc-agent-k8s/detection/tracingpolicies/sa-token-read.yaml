# Observe-only: record every open() of the pod's service account token.
# security_file_open sees the resolved path, so the /var/run -> /run
# symlink does not hide the read. No namespace selector: Tetragon's
# matchNamespaces matches Linux namespaces, not Kubernetes ones. The
# Kubernetes-namespace scoping happens in the Tetragon export denylist
# (infra/tetragon-values.yaml) and in the LogQL rules.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: sa-token-read
spec:
  kprobes:
    - call: security_file_open
      syscall: false
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /run/secrets/kubernetes.io/serviceaccount/
                - /var/run/secrets/kubernetes.io/serviceaccount/
