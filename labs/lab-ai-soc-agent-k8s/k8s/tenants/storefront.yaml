apiVersion: v1
kind: ServiceAccount
metadata: { name: storefront, namespace: storefront }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storefront, namespace: storefront, labels: { app: storefront } }
spec:
  replicas: 1
  selector: { matchLabels: { app: storefront } }
  template:
    metadata: { labels: { app: storefront } }
    spec:
      serviceAccountName: storefront
      # Pinned to the worker that publishes the NodePort, so the client
      # source IP in the request log is the real caller.
      nodeSelector: { kubernetes.io/hostname: ai-soc-worker }
      containers:
        - name: storefront
          image: lab-ai-soc/tenants:local
          imagePullPolicy: IfNotPresent
          args: ["storefront"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata: { name: storefront, namespace: storefront }
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: { app: storefront }
  ports:
    - { port: 80, targetPort: 8080, nodePort: 30080 }
