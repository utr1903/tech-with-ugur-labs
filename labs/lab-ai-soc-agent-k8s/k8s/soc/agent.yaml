apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: soc-reports, namespace: soc }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: soc-agent, namespace: soc, labels: { app: soc-agent } }
spec:
  replicas: 1
  strategy: { type: Recreate } # the volume is ReadWriteOnce
  selector: { matchLabels: { app: soc-agent } }
  template:
    metadata: { labels: { app: soc-agent } }
    spec:
      serviceAccountName: soc-reader
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: lab-ai-soc/soc:local
          imagePullPolicy: IfNotPresent
          args: ["agent"]
          ports: [{ containerPort: 8080 }]
          env:
            - { name: LOG_LEVEL, value: info }
            - { name: PORT, value: "8080" }
            - { name: RESPONDER_URL, value: "http://soc-responder.soc.svc:8081" }
            - { name: LOKI_URL, value: "http://loki.observability.svc:3100" }
            - { name: REPORTS_DIR, value: /data/reports }
            - name: AGENT_TOKEN
              valueFrom: { secretKeyRef: { name: soc-tokens, key: agent-token } }
            # The agent may ask the responder for actions and secret metadata;
            # it never gets the admin token that approves them.
            - name: RESPONDER_TOKEN
              valueFrom: { secretKeyRef: { name: soc-tokens, key: responder-token } }
            # The only place the model key is mounted.
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: anthropic, key: api-key } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: reports, mountPath: /data/reports }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: reports
          persistentVolumeClaim: { claimName: soc-reports }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: soc-agent, namespace: soc }
spec:
  selector: { app: soc-agent }
  ports: [{ port: 8080, targetPort: 8080 }]
