# dnsmasq: the lab's only resolver, and the DNS visibility layer.

# Be authoritative for *.lab and nothing else. With no upstream servers
# (no-resolv) and no /etc/hosts (no-hosts), any name outside .lab gets no
# answer — even a real domain could not be resolved from inside the lab.
no-resolv
no-hosts

# Wildcard: every name ending in .lab (any depth) resolves to the webhost.
# This is how one container impersonates the vendor, both beacon sinks and the
# C2 host.
address=/lab/10.10.0.10

# The DNS visibility layer: one line per query, e.g.
#   query[A] cdn-metrics.tracklab.lab from 10.10.0.2
# written to a file in the shared `dnslog` mount (`tmp/dnslog/` on the host)
# that the analyzer reads.
log-queries
log-facility=/var/log/dns/queries.log

# Answer on every interface inside the container.
listen-address=0.0.0.0
bind-interfaces
