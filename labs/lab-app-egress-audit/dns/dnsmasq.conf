# Resolve every *.lab name to the lab webhost. Nothing else resolves — the lab
# is fully offline, so there is no upstream to forward to.
no-resolv
no-hosts
address=/lab/10.10.2.10

# The DNS visibility layer: log every query to a file on the shared volume.
log-queries
log-facility=/var/log/dns/queries.log

# Answer on all interfaces inside the container.
listen-address=0.0.0.0
bind-interfaces
