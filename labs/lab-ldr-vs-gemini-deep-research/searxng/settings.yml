# Search backend for Local Deep Research. Only the loopback network and the
# compose network reach it, so the bot limiter is off. The secret key comes
# from the SEARXNG_SECRET environment variable.
use_default_settings: true

server:
  limiter: false

search:
  formats:
    - html
    - json

# This SearXNG release enables only two web engines for the "general"
# category: duckduckgo and the keyless google cse. Repeated research runs
# get both throttled from one home IP within the hour, and then every search
# comes back empty. Spread the load over several independent engines.
engines:
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
  - name: google cse
    disabled: true
