# Synthetic teaching inputs for one factory, one product, and three years.
product:
  # Fixed sale price in USD per unit; finite and > 0; applies to units sold in every year and sets annual revenue.
  selling_price_usd_per_unit: 90
  demand_units:
    # Maximum units sold in year 1; finite and >= 0; caps year-1 production sold immediately.
    year_1: 4000
    # Maximum units sold in year 2; finite and >= 0; caps year-2 production sold immediately.
    year_2: 6000
    # Maximum units sold in year 3; finite and >= 0; caps year-3 production sold immediately.
    year_3: 6000

manufacturing:
  # Starting materials-and-electricity cost in USD/unit; finite and > 0; used in year 1 before research savings.
  initial_unit_cost_usd: 50
  # Lowest permitted materials-and-electricity cost in USD/unit; finite, > 0, and <= initial cost; constrains accumulated research savings.
  minimum_unit_cost_usd: 25
  # Annual production supported by one worker in units/person/year; finite and > 0; links production to worker count.
  units_per_worker_per_year: 1000
  # Manufacturing salary in USD/person/year; finite and > 0; charged for each worker in that year.
  worker_salary_usd_per_year: 20000
  # Largest manufacturing team in any year; integer >= 0; bounds each annual worker decision.
  max_workers: 6
  # Existing factory output limit in units/year; finite and > 0; caps production before any expansion is available.
  capacity_units_per_year: 4000

research:
  # Research salary in USD/person/year; finite and > 0; charged in the research year even though savings begin next year.
  researcher_salary_usd_per_year: 10000
  # Largest research team in any year; integer >= 0 with nonnegative marginal savings; bounds each annual researcher decision.
  max_researchers: 3
  # Next-year unit-cost saving from the first researcher in USD/unit; finite and > 0; starts each year's diminishing-return sum.
  first_researcher_saving_usd_per_unit: 4
  # Reduction in each additional researcher's saving in USD/unit; finite and > 0; shapes the diminishing-return sum.
  saving_drop_per_additional_researcher: 1

expansion:
  # One-time expansion payment in USD; finite and > 0; charged in the chosen start year.
  cost_usd: 50000
  # Added factory output in units/year; finite and > 0; becomes available one year after a year-1 or year-2 start and then persists.
  extra_capacity_units_per_year: 2000

solver:
  # Solve-time limit in seconds; finite and > 0; stops SCIP after this elapsed time if needed.
  time_limit_seconds: 120
  # Relative optimality-gap target; finite in [0, 1); allows SCIP to stop when bound and incumbent are within this fraction.
  relative_gap: 0.01
