[project]
name = "app"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "structlog==26.1.0",
    "sympy==1.14.0",
    "uvicorn==0.52.4",
]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = [
    "deptry==0.25.1",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM",
  "RET", "ARG", "PTH", "ANN", "TRY", "LOG", "G", "C90",
]
ignore = [
  # TRY003: contextual f-string messages in raises are the readable form
  # the python-logging standard itself uses.
  "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.deptry]
known_first_party = ["app"]
extend_exclude = [".*_test\\.py", ".*conftest\\.py"]

[tool.deptry.per_rule_ignores]
# The compute stack (numpy, pandas, scipy, scikit-learn, sympy) is never
# imported by the sandbox server itself: it is installed for the Python
# code users submit, and /capabilities reports its versions. Removing any
# of them breaks that contract (the Task 3 capabilities test).
#
# fastapi, pydantic and uvicorn are declared now because this pyproject.toml
# is the whole sandbox service's final dependency set, but this task (the
# execution core) has no HTTP layer yet -- the next task wires the FastAPI
# app that imports all three. Confirmed by running `deptry src` before this
# exception existed: it reported all eight names, and none of the eight is
# imported anywhere in this task's own code. This half of the list should
# shrink to nothing once the HTTP task lands.
DEP002 = [
    "numpy", "pandas", "scipy", "scikit-learn", "sympy",
    "fastapi", "pydantic", "uvicorn",
]
