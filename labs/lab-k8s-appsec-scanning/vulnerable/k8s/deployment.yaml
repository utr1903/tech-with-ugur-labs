apiVersion: v1
kind: Namespace
metadata:
  name: appsec-scan
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-app
  namespace: appsec-scan
  labels:
    app: vuln-app
spec:
  type: NodePort
  selector:
    app: vuln-app
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-app
  namespace: appsec-scan
  labels:
    app: vuln-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-app
  template:
    metadata:
      labels:
        app: vuln-app
    spec:
      # DELIBERATELY VULNERABLE: no securityContext, no cpu limit, no liveness probe
      containers:
        - name: vuln-app
          image: vuln-app-scanning:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: "postgres://appuser:appuser@postgres:5432/appdb"
          resources:
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
