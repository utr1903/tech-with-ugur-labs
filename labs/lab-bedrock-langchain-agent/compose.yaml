services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop-local-only}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop-local-only}@postgres:5432/shop
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      # The AWS SDK looks for the sign-in files under the home directory; this
      # keeps that path the same when the service is run as another user.
      HOME: /home/node
    volumes:
      # Read-only: the app only needs to know which login session to use.
      - type: bind
        source: ${HOME}/.aws/config
        target: /home/node/.aws/config
        read_only: true
        bind: { create_host_path: false }
      # Writable: the SDK writes refreshed 15-minute credentials back here.
      - type: bind
        source: ${HOME}/.aws/login/cache
        target: /home/node/.aws/login/cache
        bind: { create_host_path: false }
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  # Runs unit tests. No AWS mounts: tests never need credentials.
  test:
    profiles: ["test"]
    build: .
    environment:
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop-local-only}@postgres:5432/shop_test
      ADMIN_DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop-local-only}@postgres:5432/shop
      AWS_REGION: us-east-1
      LOG_LEVEL: silent
    depends_on:
      postgres: { condition: service_healthy }
    command: ["npm", "test"]

volumes:
  database:
