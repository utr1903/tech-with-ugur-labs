[project]
name = "app"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "cvxpy==1.9.3",
  "numpy==2.5.3",
  "PyYAML==6.0.3",
  "matplotlib==3.11.2",
  "structlog==26.1.0",
]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = [
  "deptry==0.25.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "scipy==1.18.1",
  "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM",
  "RET", "ARG", "PTH", "ANN", "TRY", "LOG", "G", "C90",
]
ignore = [
  # TRY003: forbids a contextual f-string message in a raise; validation
  # needs contextual messages so readers know exactly which field to edit.
  "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# matplotlib ships no py.typed marker and no maintained stub package.
module = ["matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cvxpy 1.9.3 ships a py.typed marker but re-exports its public API via
# bare `from cvxpy.atoms import *` in cvxpy/__init__.py with no __all__.
# mypy's --no-implicit-reexport (part of --strict) then reports "Module
# has no attribute" for names such as cp.sum / cp.sum_largest even though
# they exist at runtime and are cvxpy's documented public API.
# implicit_reexport is scoped to this one module override, evaluated
# against cvxpy's own exported symbol table, so every other module in
# this codebase stays fully re-export-strict.
module = ["cvxpy", "cvxpy.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# cvxpy's own module-level installed_solvers() and Problem.solve() carry
# no internal type annotations, so --strict's disallow_untyped_calls
# flags every call site regardless of import visibility. That flag is
# evaluated against the calling file's config, not the callee's module,
# so (unlike implicit_reexport above) it cannot be scoped to cvxpy.* —
# it has to be relaxed here, in the one file that calls the raw solver
# API directly. Any future module that calls cvxpy's .solve() or
# installed_solvers() needs the same narrow per-file override, not a
# project-wide one.
module = ["app.toolchain_test"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
addopts = "--import-mode=importlib"

[tool.deptry]
known_first_party = ["app"]
extend_exclude = [".*_test\\.py", ".*conftest\\.py"]
