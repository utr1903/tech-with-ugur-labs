[project]
name = "app"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
  "cvxpy==1.9.3",
  "numpy==2.5.3",
  "PyYAML==6.0.3",
  "matplotlib==3.11.2",
  "structlog==26.1.0",
]

[project.scripts]
app = "app.__main__:main"

[dependency-groups]
dev = [
  "deptry==0.25.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.8",
  "scipy==1.18.1",
  "scipy-stubs==1.18.1.0",
  "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM",
  "RET", "ARG", "PTH", "ANN", "TRY", "LOG", "G", "C90",
]
ignore = [
  # TRY003: forbids a contextual f-string message in a raise; validation
  # needs contextual messages so readers know exactly which field to edit.
  "TRY003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# matplotlib ships no py.typed marker and no maintained stub package.
module = ["matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cvxpy 1.9.3 ships a py.typed marker but re-exports its public API via
# bare `from cvxpy.atoms import *` in cvxpy/__init__.py with no __all__.
# mypy's --no-implicit-reexport (part of --strict) then reports "Module
# has no attribute" for names such as cp.sum / cp.sum_largest even though
# they exist at runtime and are cvxpy's documented public API.
# implicit_reexport is scoped to this one module override, evaluated
# against cvxpy's own exported symbol table, so every other module in
# this codebase stays fully re-export-strict.
module = ["cvxpy", "cvxpy.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Measured, not assumed: running --strict against a module that builds and
# solves a real CVaR-shaped LP with cp.Variable, cp.Minimize, cp.Problem,
# cp.sum, cp.abs, cp.sum_largest, cp.quad_form, cp.psd_wrap,
# constraint.dual_value, problem.value and problem.status surfaces exactly
# two errors, both no-untyped-call: cvxpy's module-level
# installed_solvers() and Problem.solve() carry no internal annotations.
# Every other symbol in that surface is already strict-clean. That flag is
# evaluated against the calling file's config, not the callee's module, so
# (unlike implicit_reexport above) it cannot be scoped to cvxpy.* — so both
# calls are confined to app/cvxpy_api.py, the app's one typed facade over
# them, and only that module gets this override. Adding this override to
# any other module is a defect: it would relax disallow_untyped_calls over
# real model/solver logic instead of the two-function facade that exists
# to prevent exactly that.
module = ["app.cvxpy_api"]
disallow_untyped_calls = false
# `Problem.is_dcp` is annotated `(self, dpp: bool = False) -> bool`, but
# CVXPY memoizes it with a `compute_once` decorator declared as
# `Callable[[T], R] -> Callable[[T], R]` — a signature with room for
# `self` and nothing else. mypy therefore sees `is_dcp()` and rejects the
# `dpp=True` the DPP check needs as an unexpected keyword. Unlike
# `disallow_untyped_calls` this is an error code rather than a strictness
# flag, so it is disabled only for this module, whose whole contents are
# forty lines of one-expression wrappers where there is no real call-arg
# mistake for it to hide.
disable_error_code = ["call-arg"]

[tool.pytest.ini_options]
python_files = ["*_test.py"]
testpaths = ["src"]
addopts = "--import-mode=importlib"

[tool.deptry]
known_first_party = ["app"]
extend_exclude = [".*_test\\.py", ".*conftest\\.py"]
