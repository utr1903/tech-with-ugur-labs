# The mandate. The starting book above uses exactly 1.32 of NAV gross,
# which is the whole gross budget below. Its net exposure is exactly 0.0
# and every sector net is exactly 0.0, both by construction — but it is
# not beta neutral: the long half carries slightly more market sensitivity
# than the short half, so the book runs a beta of +0.0065 inside a +/-0.02
# band. Flat in notional is not the same thing as flat in risk, and the
# gap between those two is a large part of why this mandate has a beta
# limit at all. So the desk begins at its balance-sheet limit: the solve
# is genuinely "what should we trade", and every new position has to be
# funded by closing another.
#
# THESE LIMITS ARE TIGHTER THAN A TEXTBOOK MANDATE, ON PURPOSE. They were
# chosen by measurement so that the constraints actually bite at the
# headline target, because a shadow price is only worth printing when the
# constraint it belongs to is doing something. Loosen the gross cap back
# toward 2.0, or widen the beta band, and you will watch the matching
# shadow prices fall to zero — which is the mathematics working exactly as
# it should, not the lab breaking. Trying that is a better way to
# understand duality than reading about it. Measured at the shipped 10,000
# scenarios and the 0.008 target: at a 1.40 gross cap the beta band never
# binds at all and the gross dual is 0.0010; at 1.32 the beta band binds
# and the gross dual is 0.0083, eight times larger.
#
# ONE THING TO KNOW BEFORE READING THE LIMITS BELOW. Four of them are
# mandates about the book but are *enforced* on a stand-in for it. Gross
# leverage, the per-name cap and the per-sector gross cap are all written
# on `l + s`, the long and short legs the model splits each weight into;
# the turnover budget is written on `t`, the leg that stands in for
# `|w - w0|`. Those legs are only bounded to be at least the thing they
# stand for, so `l + s >= |w|` and `t >= |w - w0|` always, with equality
# where the solved book makes an inflated leg strictly worse. Where that
# holds, the two readings coincide and the distinction does not matter.
# Where it does not, they diverge: at the 0.008 target with the borrow
# fees and half-spreads switched off, the book runs 1.0325 of NAV gross at
# 600 scenarios while the row the solver enforces sits at 1.3159 of the
# 1.32 cap; at the shipped 10,000 it is 1.2438 against 1.3184.
#
# So each limit below says both what it means for the book and which
# expression carries it. The three limits written directly on `w` — net
# exposure, the beta band and the per-sector *net* cap — have no such gap
# and are not annotated. `model_desk.py` derives when the two coincide and
# `model_desk_test.py` pins it by experiment.
desk_limits:
  # The book may run at most 1.32 of NAV long plus short combined —
  # exactly what the starting book already uses, so the desk begins with
  # no balance sheet to spare.
  #
  # Enforced as `sum(l + s) <= 1.32`, not as `sum |w| <= 1.32`.
  #
  # Those two numbers being equal is not a coincidence and it has a
  # consequence worth knowing before you edit anything. Raise a
  # `start_weight` in the universe above and the starting book breaches
  # this cap, so the loader refuses the whole scenario with
  # `universe.start_book breaches the desk limits: gross ... > 1.32`.
  # Raise this cap alongside it and the file loads again — at the cost of
  # the gross dual, which shrinks as the constraint slackens. Both halves
  # of that trade are the lesson.
  #
  # It does not bind everywhere, and this is the place to be careful about
  # which quantity is being read. Swept across the 25 frontier targets at
  # 10,000 scenarios, the *book* holds 0.82 of NAV gross for the bottom
  # ten points, up to 0.00375, and only grows into the cap at the top
  # three feasible targets, 0.00792 upward — which includes the 0.008
  # headline.
  #
  # The *row* tells a different story and it is not the one that matters:
  # `sum(l + s)` sits at 1.3167 to 1.3172 of 1.32 across that whole bottom
  # stretch, because with the return target slack nothing charges for an
  # inflated leg and the padding expands to fill the budget. The number
  # that settles it is the dual, which runs 4e-14 to 3e-13 there — the
  # balance sheet costs nothing, so it is not what is standing in the way.
  # Slack in a row is not headroom; a zero shadow price is.
  gross_leverage_max: 1.32
  # sum w. Long and short legs must roughly cancel.
  net_exposure_min: -0.10
  net_exposure_max: 0.10
  # market_beta . w. Tighter than net exposure, because a beta-neutral book
  # is the point of the fund. Widening it back to the +/-0.05 this started
  # at does not switch the limit off, but it does move it out of the way
  # of the portfolio the lab actually reports: at 10,000 scenarios the
  # book then runs a beta of +0.0347 at the 0.008 headline with the band
  # nowhere near binding, and the upper side comes into contact only at
  # 0.00875, the single most demanding feasible target, where it prices at
  # 2.7e-03. So at +/-0.05 the headline portfolio's beta dual is zero and
  # one point at the far end of the frontier carries the whole story; at
  # +/-0.02 the headline itself is priced.
  #
  # WHICH SIDE BINDS DEPENDS ON THE SAMPLE, and this is the sharpest
  # example in the file of why every claim here names a scenario count.
  # At the shipped 10,000 scenarios the book wants to be slightly long the
  # market: the *upper* side binds at the top three feasible targets, the
  # 0.008 headline among them, with a dual of 2.7e-03, while `beta_lower`
  # never binds and sits at 2e-14. At the 600 scenarios the tests use, the
  # book wants the opposite — the *lower* side binds from 0.00792 to
  # 0.00875 and the upper side never binds at all. Same mandate, same
  # generator, opposite sign, because at 600 draws the sample mean has not
  # settled down yet.
  #
  # Whichever side is inactive is the lab's honest example of a shadow
  # price that means nothing. An inactive constraint has no price, and a
  # number near machine epsilon is what "no price" looks like coming out
  # of a solver — not a small price. Do not read it as one.
  beta_min: -0.02
  beta_max: 0.02
  # The most any single name may be held long or short. Enforced as
  # `l_i + s_i <= 0.12`, not as `|w_i| <= 0.12`. 30 names at this cap could
  # hold 3.60 of gross, comfortably above gross_leverage_max, so it is
  # reachable — and at 10,000 scenarios it is reached, but only at the
  # single most demanding feasible target, 0.00875.
  name_gross_cap: 0.12
  # |sum of w over one sector|. At the shipped 10,000 scenarios this is
  # the first of the caps to start biting as the return target rises:
  # staples pins at the negative cap from 0.00625 upward and energy joins
  # at the positive cap from 0.00708, both well before the gross cap does
  # at 0.00792. That is the trade the optimizer wants — long energy, short
  # staples — and this is the limit that stops it being the whole book.
  # At 600 scenarios it never binds at any target, and `beta_min` bites
  # first instead.
  sector_net_cap: 0.11
  # The most one sector may hold long plus short. Enforced as
  # `Msec @ (l + s) <= 0.35`, not on `|w|`. Binds at no target on the
  # frontier at either 600 or 10,000 scenarios; it is here as a limit a
  # reader can tighten to watch a new constraint take over.
  sector_gross_cap: 0.35
  # How much notional the desk may trade, one way. Enforced as
  # `sum(t) <= 0.50`, where `t` is the model's stand-in for
  # `|w - start_weight|` rather than that quantity itself. The desk cannot
  # rebuild the book in a single month. This is the one limit that binds
  # at every feasible target on the frontier, from 0.000 to the ceiling,
  # and the one claim in this block that survives a change of sample size:
  # all 22 solvable points sit exactly on it at 10,000 scenarios, and all
  # 25 do at 600.
  turnover_max: 0.50

# The seeded generator. Read market.py alongside this block: every field
# here is one component of r = alpha + beta*f + style + idiosyncratic + jump.
market:
  # fat_tailed is the market the fund actually faces. gaussian is the
  # control: same factor structure, same first two moments per name, but
  # every heavy tail replaced by a normal.
  mode: fat_tailed
  # Seeds and sizes. The out-of-sample block is drawn from a different seed
  # and is never shown to the optimizer, which is what makes the in-sample
  # optimism study honest.
  seed: 20260920
  scenarios: 10000
  out_of_sample_seed: 20260921
  out_of_sample_scenarios: 10000
  # Style factors. Their loadings are derived from sector membership in
  # code, so neighbouring sectors co-move without a 30-by-3 table here.
  factor_count: 3
  # The market factor is a two-regime mixture: a calm month, or, with
  # probability stress_probability, a stressed one. This is what makes the
  # market itself left-skewed, and it is also why the expected market
  # return is slightly negative (0.035 * -0.100 = -0.0035 per month).
  calm_sigma: 0.030
  stress_probability: 0.035
  stress_mean: -0.100
  stress_sigma: 0.075
  # Name-specific noise: a Student-t, rescaled to unit variance, so it has
  # the same standard deviation as a normal but far heavier tails. Keep the
  # degrees of freedom above 4 if you want the reported kurtosis to settle
  # down; below 2 the variance does not exist at all and the loader says so.
  idiosyncratic_df: 5.0
  idiosyncratic_sigma: 0.045
  # Rare one-sided crashes in the named companies, and the reason this lab
  # has anything to show.
  #
  # A 0.2% chance per month of a 70% drop is a jump component whose own
  # standard deviation is 0.0317. Variances add in quadrature, though, so
  # bolting it onto a name already carrying a standard deviation near 0.06
  # raises that name's total by only 0.0068 to 0.0085 — well under a
  # percentage point of monthly volatility. A variance model prices that as
  # almost nothing. Meanwhile the chance that at least one of the eight
  # carriers jumps in a given month is about 1.6%, which is roughly a third
  # of the worst 5% of scenarios, and the worst 5% is the only place CVaR
  # looks. Moving volatility by a rounding error while owning a third of
  # the tail is the entire experiment.
  #
  # Be aware of what that means if you edit these three numbers. The
  # divergence between the CVaR book and the variance book is carried by
  # this channel and essentially only this channel: the Student-t shock
  # above is symmetric and identical for every name, so it fattens the
  # tail without giving CVaR a reason to prefer one name over another, and
  # the market factor's skew is hedged away by the beta band. Tone the
  # jumps down — say to a 1% chance of an 18% drop — and the two models
  # converge to nearly the same book. That is the mathematics behaving
  # correctly, not the lab breaking: when the return distribution is close
  # enough to elliptical, minimizing CVaR and minimizing variance really
  # are the same problem. The lab is a demonstration of when they are not.
  jump_probability: 0.002
  jump_mean: -0.70
  jump_sigma: 0.12
  # Eight of the thirty names, spread over five sectors, so no sector-
  # neutral book can dodge all of them at once.
  jump_names: [TCH1, TCH5, HLC2, FIN1, FIN5, IND2, ENE1, ENE4]

# The return-target sweep behind the frontier chart. The top of the range
# sits above what the mandate can reach, on purpose: the last few points
# come back infeasible and the lab reports that status verbatim instead of
# quietly dropping them.
#
# Measured at the shipped 10,000 scenarios: 22 of the 25 points solve and
# 3 do not, the first infeasible target being 0.009167 against a ceiling
# of 0.008882. Like everything else here that depends on the draw, that
# split moves with the sample — at 600 scenarios the ceiling is 0.010383,
# above the top of this range, so every point solves and the infeasible
# case is not demonstrated at all.
frontier:
  points: 25
  min_target_monthly: 0.000
  max_target_monthly: 0.010

# The scenario-count ladder the three algorithms are timed on, and how
# closely their objectives have to agree.
algorithms:
  scenario_ladder: [500, 2000, 8000]
  objective_relative_tolerance: 1.0e-6

# The two seed-averaged comparison studies.
studies:
  # Seeds averaged over, and scenarios per seed. This is larger than
  # market.scenarios on purpose: the studies measure the distance between
  # two optimized books, and that distance carries the sampling error of
  # both tail estimates, so it needs a finer sample than a single solve.
  seeds: 5
  scenarios: 25000
  # The return target both models are held to while being compared.
  matched_target_monthly: 0.005
  # In gaussian mode the two models should land on nearly the same book:
  # for an elliptical distribution, minimizing CVaR and minimizing variance
  # are the same problem. This is the L1 weight distance allowed there.
  #
  # Measured at the settings above and the recalibrated desk limits:
  # 0.0328 to 0.0444 across the five seeds. What is left is sampling error
  # in the tail estimate rather than a real difference, and it shrinks
  # like 1 / sqrt(scenarios) — a three-seed check at 8,000 scenarios
  # measures 0.060 to 0.076 instead. Cut `scenarios` above and this
  # tolerance has to rise with it.
  elliptical_weight_tolerance: 0.10
  # In fat_tailed mode they should not. This is how many times further
  # apart the two books have to be than they were in the control.
  #
  # Measured at the settings above: a ratio of means of 3.295 at the
  # recalibrated desk limits, against 3.293 at the looser ones — the two
  # models diverge by the shape of the loss distribution, and tightening
  # the mandate did not change that. The floor sits well below either,
  # which leaves room for seed-to-seed noise while still failing loudly if
  # the effect disappears.
  #
  # Like the tolerance above it was calibrated at 25,000 scenarios, and
  # because the control's distance shrinks with the sample while the
  # fat-tailed difference does not, a smaller sample measures a smaller
  # ratio: five seeds give 3.295 at 25,000, while a three-seed check at
  # 8,000 measures only 2.11, already close to this floor. Cutting
  # `scenarios` to make a run finish faster will fail this check long
  # before the effect it measures has actually gone away.
  divergence_ratio_min: 2.0

# Slack allowed by each independent check of a solved portfolio.
tolerances:
  constraint_abs: 1.0e-7
  cvar_agreement_abs: 1.0e-6
  var_recovery_abs: 1.0e-6
  solver_agreement_rel: 1.0e-6
  relaxation_abs: 1.0e-7
  dual_relative: 0.02
