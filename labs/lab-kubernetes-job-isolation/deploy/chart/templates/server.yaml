{"apiVersion":"v1","kind":"PersistentVolumeClaim","metadata":{"name":"execution-data","namespace":{{ .Release.Namespace | toJson }}},"spec":{"accessModes":["ReadWriteOnce"],"storageClassName":"standard","resources":{"requests":{"storage":{{ .Values.storageSize | toJson }}}}}}
---
{
  "apiVersion":"apps/v1","kind":"Deployment",
  "metadata":{"name":"server","namespace":{{ .Release.Namespace | toJson }}},
  "spec":{"replicas":1,"strategy":{"type":"Recreate"},"selector":{"matchLabels":{"app.kubernetes.io/component":"server"}},
    "template":{"metadata":{"labels":{"app.kubernetes.io/component":"server"}},"spec":{
      "serviceAccountName":"server","automountServiceAccountToken":true,"securityContext":{"runAsUser":0,"runAsGroup":0},
      "containers":[{"name":"server","image":{{ .Values.serverImage | toJson }},"imagePullPolicy":"IfNotPresent",
        "ports":[{"containerPort":3000}],
        "env":[{"name":"PORT","value":"3000"},{"name":"NAMESPACE","value":{{ .Release.Namespace | toJson }}},{"name":"WORKER_IMAGE","value":{{ .Values.workerImage | toJson }}},{"name":"PVC_NAME","value":"execution-data"},{"name":"SECURE_MODE","value":{{ .Values.secure | toString | toJson }}},{"name":"DATA_ROOT","value":"/data"}],
        "readinessProbe":{"tcpSocket":{"port":3000},"initialDelaySeconds":1,"periodSeconds":2},
        "resources":{"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"16Mi"},"limits":{"cpu":"500m","memory":"256Mi","ephemeral-storage":"128Mi"}},
        "volumeMounts":[{"name":"data","mountPath":"/data"}]}],
      "volumes":[{"name":"data","persistentVolumeClaim":{"claimName":"execution-data"}}]
    }}
  }
}
---
{"apiVersion":"v1","kind":"Service","metadata":{"name":"server","namespace":{{ .Release.Namespace | toJson }}},"spec":{"selector":{"app.kubernetes.io/component":"server"},"ports":[{"port":3000,"targetPort":3000}]}}
