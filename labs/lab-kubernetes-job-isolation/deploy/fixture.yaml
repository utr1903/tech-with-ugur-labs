apiVersion: v1
kind: Namespace
metadata:
  name: download-fixture
  labels:
    app.kubernetes.io/part-of: job-isolation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: download-fixture
  namespace: download-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: download-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: download-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: lab-kubernetes-job-isolation-fixture:local-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: download-fixture
  namespace: download-fixture
spec:
  selector:
    app.kubernetes.io/name: download-fixture
  ports:
    - port: 8080
      targetPort: 8080
